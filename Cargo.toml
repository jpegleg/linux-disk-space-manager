[package]
name = "linux-disk-space-manager"
version = "1.0.10"
edition = "2021"
authors = ["Keegan Bowen <carefuldata@protonmail.com>"]
license = "MIT"
description = "a system controller for linux disk space management"
homepage = "https://carefuldata.com"
repository = "https://github.com/jpegleg/linux-disk-space-manager"
readme = "README.md"
categories = ["filesystem"]
keywords = ["disk", "diskspace", "disk-controller", "linux-administration", "linux-controller"]

[badges]
maintenance = { status = "actively-developed" }

[dependencies]
serde       = { version = "1", features = ["derive"] }
yaml_serde = "0.10.4"
nix         = { version = "0.27", features = ["fs"] }
chrono      = "0.4"
gethostname = "1"
glob        = "0.3"
flate2      = "1"

[dependencies.indexmap]
version = "=2.6.0"

[profile.release]
opt-level   = 3
strip       = true
lto         = true
panic       = "abort"
